# 宝塔 Nginx 站点配置 — luyingzl.xianmaxiong.com（露营装备租赁 H5）
# 用法：宝塔 → 网站 → luyingzl.xianmaxiong.com → 设置 → 配置文件
# 将 server { ... } 块整体替换为此文件内容（保留宝塔自动生成的 SSL 证书路径若不同）
#
# 部署前确认：
# 1. 重新 H5 打包（HBuilderX 或 npm run build:h5），上传 dist/build/h5 全部内容
# 2. 必须包含 assets/uicon-iconfont-*.ttf（Vite 打包字体）和 static/fonts/uicon-iconfont.ttf
# 3. 若图标空白：打开 DevTools 看 <up-icon> 是否为空标签（组件未注册），需包含最新 main.js 修复
# 4. 修改 nginx 后执行：nginx -t && nginx -s reload
# 5. 验证字体：https://luyingzl.xianmaxiong.com/assets/uicon-iconfont-*.ttf
#    Content-Type 应为 font/ttf，不能是 text/html 或仅靠 application/octet-stream

server
{
    listen 80;
    listen 443 ssl http2;
    server_name luyingzl.xianmaxiong.com;
    index index.html index.htm default.htm default.html;
    root /www/wwwroot/luyingzl.xianmaxiong.com;

    #CERT-APPLY-CHECK--START
    include /www/server/panel/vhost/nginx/well-known/luyingzl.xianmaxiong.com.conf;
    #CERT-APPLY-CHECK--END
    include /www/server/panel/vhost/nginx/extension/luyingzl.xianmaxiong.com/*.conf;

    #SSL-START
    ssl_certificate    /www/server/panel/vhost/cert/luyingzl.xianmaxiong.com/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/luyingzl.xianmaxiong.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    error_page 497 https://$host$request_uri;
    #SSL-END

    error_page 404 /404.html;

    # 纯 H5 静态站可注释掉 PHP
    # include enable-php-80.conf;

    include /www/server/panel/vhost/rewrite/luyingzl.xianmaxiong.com.conf;

    client_max_body_size 10240M;

    # 禁止访问敏感文件
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
    {
        return 404;
    }

    location ~ \.well-known
    {
        allow all;
    }

    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" )
    {
        return 403;
    }

    # 微信菜单代理
    location ^~ /wxapi
    {
        proxy_pass https://api.weixin.qq.com/cgi-bin/menu;
    }

    # OSS 图片代理
    location ^~ /img
    {
        proxy_pass https://shegnqx.oss-cn-beijing.aliyuncs.com/;
    }

    # 后端 API
    location ^~ /sqx_fast
    {
        proxy_pass http://127.0.0.1:9188/sqx_fast;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket
    location /wss/
    {
        proxy_pass http://127.0.0.1:9188/sqx_fast/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # 字体 MIME（错误类型会导致 @font-face 加载失败、图标空白）
    types {
        font/ttf                         ttf;
        font/woff                        woff;
        font/woff2                       woff2;
        application/vnd.ms-fontobject    eot;
    }

    # 静态资源目录（字体、tabbar 图标等）— 必须优先于 SPA fallback
    location ^~ /static/
    {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # 打包产物 assets 目录（Vite/uni-app H5 构建输出，含打包后的 uicon-iconfont.ttf）
    location ^~ /assets/
    {
        expires 12h;
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # 字体需正确 MIME，application/octet-stream 会导致部分浏览器/WebView @font-face 失败
    location ~* \.(ttf|otf)$ {
        add_header Access-Control-Allow-Origin "*";
        types { font/ttf ttf; font/otf otf; }
        default_type font/ttf;
        try_files $uri =404;
    }

    # 图片 / 字体 / 其他静态后缀
    location ~* \.(gif|jpg|jpeg|png|bmp|swf|ico|svg|webp|ttf|woff|woff2|eot|mp4|mp3|json)$
    {
        expires 30d;
        error_log /dev/null;
        access_log /dev/null;
    }

    location ~* \.(js|css)$
    {
        expires 12h;
        error_log /dev/null;
        access_log /dev/null;
    }

    # SPA history 模式 — 用 try_files，不要用 rewrite 全部指向 index.html
    location /
    {
        if ($request_method = 'OPTIONS')
        {
            return 204;
        }
        try_files $uri $uri/ /index.html;
    }

    access_log /www/wwwlogs/luyingzl.xianmaxiong.com.log;
    error_log /www/wwwlogs/luyingzl.xianmaxiong.com.error.log;
}
